[package]
name = "relus-mysql-cdc-candidate"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.0"
publish = false

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
mysql_async = { version = "=0.37.1", default-features = false, features = [
    "minimal-rust",
    "rustls-tls",
    "ring",
    "tls12",
    "binlog",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
uuid = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
